services:
  postgres:
    image: postgres:15-alpine
    container_name: gongkao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gongkao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gongkao_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gongkao_dev}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gongkao} -d ${POSTGRES_DB:-gongkao_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
